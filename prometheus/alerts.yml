groups:
  - name: ChefMindAI.Alerts
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'High request latency on {{ $labels.job }}'
          description: 'P95 latency is over 1 second for the last 5 minutes.'
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'High 5xx error rate on {{ $labels.job }}'
          description: 'More than 5% of requests are failing with 5xx errors.'