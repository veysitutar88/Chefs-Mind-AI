name: chefs-mind-ai
services:
  backend:
    build:
      context: C:\Projects\Chefs-Mind-AI
      dockerfile: Dockerfile
    command:
      - node
      - dist/server/index.js
    environment:
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://user:password@host:port/database
      NEXT_PUBLIC_API_URL: http://localhost:5001
      NODE_ENV: production
      PORT: "5000"
      RATE_LIMIT: "100"
      SESSION_COOKIE_SECURE: "true"
    networks:
      default: null
    ports:
      - mode: ingress
        target: 5000
        published: "5001"
        protocol: tcp
    restart: unless-stopped
  frontend:
    build:
      context: C:\Projects\Chefs-Mind-AI\frontend-enhanced
      dockerfile: Dockerfile
    command:
      - npm
      - run
      - start
    environment:
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://user:password@host:port/database
      NEXT_PUBLIC_API_URL: http://localhost:5001
      NODE_ENV: production
      PORT: "5000"
      RATE_LIMIT: "100"
      SESSION_COOKIE_SECURE: "true"
    networks:
      default: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    restart: unless-stopped
networks:
  default:
    name: chefs-mind-ai_default
