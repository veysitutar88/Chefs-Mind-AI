# Production Docker Compose
# Usage: docker compose -f docker-compose.prod.yml up -d
# Requires: .env.prod (copy from .env.prod.example and fill in values)

# ── Shared anchors ────────────────────────────────────────────────────────────
x-common: &common
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  frontend:
    # Public-facing: backend + frontend only
  backend:
    internal: true
    # Isolated: db, redis, prometheus + backend only (no internet egress)

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  prometheus_data:

# ── Services ──────────────────────────────────────────────────────────────────
services:
  backend:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - PORT=5001
      - ENABLE_VIDEO=false
      - CORS_ORIGIN=${CORS_ORIGIN}
      - RATE_LIMIT=${RATE_LIMIT}
      - SESSION_COOKIE_SECURE=true
    command: ["node", "dist/server/index.js"]
    ports:
      - "5001:5001"
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    networks:
      - frontend
      - backend

  frontend:
    <<: *common
    build:
      context: ./frontend-enhanced
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_TELEMETRY_DISABLED=1
    command: ["node", "server.js"]
    ports:
      - "3000:3000"
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    networks:
      - frontend

  db:
    <<: *common
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
      - /run:noexec,nosuid,size=10m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - backend

  redis:
    <<: *common
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save ""
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "0.25"
    networks:
      - backend

  prometheus:
    <<: *common
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    # Bind to localhost only — not exposed to the internet
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    networks:
      - backend
