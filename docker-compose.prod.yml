services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN}
      - RATE_LIMIT=${RATE_LIMIT}
      - SESSION_COOKIE_SECURE=true
    command: ["node","dist/server/index.js"]
    ports:
      - "5001:5000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-enhanced
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    command: ["npm","run","start"]
    ports:
      - "3000:3000"
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: chefs
      POSTGRES_PASSWORD: chefs
      POSTGRES_DB: chefsmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432" # Expose DB port to host for easier debugging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chefs -d chefsmind"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: