name: Staging Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_WEBHOOK_URL }}

      - name: Wait for deployment to be ready and run smoke tests
        run: |
          echo "Waiting for staging deployment to be ready..."
          # Placeholder for actual health check or smoke test against STAGING_URL
          # For example, you might use curl or a custom script here
          # while ! curl --fail --silent --output /dev/null ${{ secrets.STAGING_URL }}/health; do
          #   echo "Staging environment not yet ready. Waiting 10 seconds..."
          #   sleep 10
          # done
          echo "Staging deployment is up. Running smoke tests..."
          # Add actual smoke tests here, e.g., curl to specific endpoints
          # curl -f ${{ secrets.STAGING_URL }}/health
          echo "Smoke tests passed for staging."